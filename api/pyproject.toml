    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.39",
    "aiosmtplib>=5.1.2",
    "slowapi>=0.1.10",
    "redis>=7.1.1",
    "orjson",
    "altcha>=1.0.0",
    "python-json-logger>=4.2.0",
    "pyproj>=3.7.2",
    "gunicorn>=26.1.0",
