name: Infra CI

on:
  push:
    branches: [main]
    paths:
      - "docker-compose*.yml"
      - "Caddyfile*"
      - "docker/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "docker-compose*.yml"
      - "Caddyfile*"
      - "docker/**"
      - ".github/workflows/infra-ci.yml"

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # env_file: .env is referenced by docker-compose.yml; config resolution
      # fails if the file is missing, so provide the placeholder values.
      - name: Provide a placeholder .env
        run: cp .env.example .env

      - name: Validate base compose file
        run: docker compose -f docker-compose.yml config -q

      - name: Validate compose with dev override
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config -q

  validate-caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SITE_ADDRESS must resolve to a non-empty value: an empty {$SITE_ADDRESS}
      # site header makes Caddy parse the block as global options instead of a
      # site block, which fails on the site-only directives below it.
      - name: Validate Caddyfile.dev
        run: |
          docker run --rm -e SITE_ADDRESS=localhost \
            -v "$PWD/Caddyfile.dev:/etc/caddy/Caddyfile" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate Caddyfile.prod
        run: |
          docker run --rm -e SITE_ADDRESS=localhost \
            -v "$PWD/Caddyfile.prod:/etc/caddy/Caddyfile" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
